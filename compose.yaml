services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: naanala
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      NAANALA_DB_PASSWORD: ${NAANALA_DB_PASSWORD:?Set NAANALA_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${NAANALA_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/001-auth.sql:/docker-entrypoint-initdb.d/001-auth.sql:ro
      - ./database/local-role.sql:/docker-entrypoint-initdb.d/002-local-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d naanala"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres-data:
